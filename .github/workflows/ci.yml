name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Ruff widens its default rules between minor releases (sentinel's CI went red that way),
      # so the version is banded; keep it in step with the dev tools in the Makefile.
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.17,<0.18"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

  test:
    name: type-check · test · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      # The default Linux torch wheel drags in several GB of CUDA libraries. Install the CPU wheel
      # first, from the same index the Dockerfile uses; requirements.txt then finds it satisfied.
      - name: Install (CPU torch first, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          make install

      # The gym wrappers and the optional env returns leave a known baseline of findings, so
      # pyright reports but does not gate.
      - name: Pyright (informational)
        continue-on-error: true
        run: pyright

      - name: Tests without the emulator
        run: make test-fast

      - name: Tests on the emulator
        run: make test-emulator

      - name: Training smoke run
        run: make smoke

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mario-rl-ppo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The default command exercises the whole import chain (cv2, nes-py, SB3).
      - name: Run the default command
        run: docker run --rm mario-rl-ppo

      # `*.json` in .dockerignore must not strip the demonstration routes.
      - name: Demo routes are in the image
        run: |
          docker run --rm mario-rl-ppo python -c "from mario.infrastructure.route_files import load_demo_route; \
          assert all(load_demo_route(f'SuperMarioBros-1-{s}-v0') for s in (1, 2, 3, 4))"

      # evaluate and record write into the working directory as the non-root user.
      - name: The working directory is writable
        run: docker run --rm mario-rl-ppo sh -c 'touch /app/.w && rm /app/.w'

      - name: Compose file is valid
        run: docker compose config -q
